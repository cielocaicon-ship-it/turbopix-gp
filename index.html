<style>
/* Layout: el juego ocupa toda la pantalla; menús flotan encima. En modo mando el celular muestra la interfaz de control. */
:root{
  --bg:#120f2a; --panel:rgba(22,18,52,.92); --line:#3b3380; --ink:#f4f1ff; --dim:#a39cd6;
  --gold:#ffc83d; --ok:#35d07f; --bad:#ff5470; --cyan:#3fd8ff;
  --disp:"Russo One","Arial Black",sans-serif; --body:"Chakra Petch","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:var(--disp);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#game{position:fixed;inset:0}
#gl{width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;pointer-events:none}
.top{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:max(10px,env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:5}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.vp{position:absolute;pointer-events:none;font-family:var(--disp);text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.6);overflow:hidden}
.vp .pos{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));font-size:clamp(26px,5vw,52px);color:var(--gold);line-height:1}
.vp .pos small{font-size:.45em;color:var(--ink)}
.vp .lap{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:calc(max(10px,env(safe-area-inset-top,0px)) + clamp(30px,5.6vw,58px));font-size:clamp(11px,1.6vw,16px)}
.vp .spd{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));font-size:clamp(14px,2.4vw,26px)}
.vp .spd small{font-size:.5em;color:var(--dim)}
.vp .tag{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:52px;font-size:12px;padding:3px 8px;border-radius:6px;color:#000;text-shadow:none}
.vp .msg{position:absolute;left:50%;top:28%;transform:translateX(-50%);font-size:clamp(16px,3vw,32px);color:var(--cyan);white-space:nowrap}
#timer{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--disp);font-size:clamp(13px,2vw,20px);background:rgba(0,0,0,.45);padding:4px 12px;border-radius:8px;font-variant-numeric:tabular-nums;z-index:2}
#minimap{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:clamp(80px,13vw,150px);height:auto;opacity:.92;z-index:2}
#big{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:clamp(60px,16vw,180px);color:var(--gold);text-shadow:0 6px 0 #b8320f,0 12px 30px rgba(0,0,0,.6);pointer-events:none}
.menu{position:fixed;inset:0;display:grid;place-items:center;overflow:auto;background:linear-gradient(180deg,rgba(18,15,42,.3),rgba(18,15,42,.88));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:20px;width:min(100%,980px);display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.logo{font-family:var(--disp);font-weight:normal;font-size:clamp(34px,7vw,72px);line-height:.95;margin:0;letter-spacing:1px;background:linear-gradient(180deg,#fff2b8,var(--gold) 55%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6a1f0f);text-wrap:balance}
.lead{color:var(--dim);font-size:15px;line-height:1.5;margin:6px 0 0;max-width:60ch}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.grid2>*{min-width:0}
.box{border:2px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start;background:rgba(0,0,0,.18)}
.lbl{font-size:12px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-weight:700}
.btn{background:var(--gold);color:#1a0f00;border:0;border-radius:10px;padding:14px 16px;font-size:15px;box-shadow:0 4px 0 #a5700a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a5700a}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.on{background:var(--cyan);color:#001a24;box-shadow:0 4px 0 #0f7fa0}
.name{font-family:var(--disp);font-size:18px;padding:12px;border-radius:10px;border:2px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);text-transform:uppercase;width:100%}
.row{display:flex;gap:8px;align-items:center}
.row .val{flex:1;text-align:center;font-family:var(--disp);font-size:15px;line-height:1.3;min-width:0}
.row .val small{display:block;font-family:var(--body);font-size:12px;color:var(--dim)}
.arrow{width:46px;height:46px;border-radius:10px;border:2px solid var(--line);background:rgba(255,255,255,.04);font-size:18px;flex:none}
.sala{justify-items:center;text-align:center}
.code{font-family:var(--disp);font-size:clamp(28px,4.5vw,44px);letter-spacing:6px;color:var(--gold)}
#qr{background:#fff;padding:8px;border-radius:8px}
#qr img,#qr canvas{display:block;width:150px;height:auto}
.small{font-size:13px;color:var(--dim);line-height:1.5}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:2px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;display:grid;gap:3px;min-width:0}
.slot b{font-family:var(--disp);font-weight:normal;color:var(--sc)}
.slot.on{border-color:var(--sc)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid rgba(0,0,0,.4)}
.sw.on{outline:3px solid #fff;outline-offset:2px}
.prev{width:100%;max-width:240px;aspect-ratio:1;justify-self:center;margin:0 auto;display:block;border-radius:12px;background:radial-gradient(circle at 50% 60%,#3b3380,#120f2a 70%)}
.stat{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;font-size:12px;font-family:var(--disp)}
.bar{display:flex;gap:4px}.bar i{flex:1;height:10px;border-radius:3px;background:#2a2560}.bar i.f{background:var(--ok)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:8px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
.hint{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:12px;color:var(--dim)}
.hint div{border:2px dashed var(--line);border-radius:10px;padding:10px 4px}
.hint b{display:block;font-family:var(--disp);color:var(--ink);font-size:16px;font-weight:normal}
.ctrl{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;overflow:auto;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
.wheel{position:relative;width:min(70vw,300px);aspect-ratio:1;margin:6px auto;border-radius:50%;border:14px solid #2a2560;box-shadow:inset 0 0 0 4px var(--line);flex:none}
.wheel i{position:absolute;left:50%;top:-14px;width:14px;height:34px;margin-left:-7px;background:var(--gold);border-radius:4px}
.wheel .hub{position:absolute;inset:32%;border-radius:50%;background:#2a2560;display:grid;place-items:center;font-family:var(--disp);font-size:22px}
.pedal{height:20px;border-radius:10px;background:#2a2560;overflow:hidden;position:relative;flex:none}
.pedal span{position:absolute;inset:0 auto 0 0;width:0}
.big2{font-family:var(--disp);font-size:clamp(26px,8vw,40px);text-align:center}
.touchzones{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;z-index:1}
.touchzones div{display:flex;align-items:flex-end;justify-content:center;padding-bottom:max(40px,env(safe-area-inset-bottom,0px));font-family:var(--disp);color:rgba(255,255,255,.3);font-size:13px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pnl{border:2px solid var(--line);border-top:4px solid var(--sc);border-radius:12px;padding:10px;display:grid;gap:4px;background:rgba(0,0,0,.2);min-width:0}
.pnl.rdy{border-color:var(--ok);border-top-color:var(--sc)}
.pnl .ph{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim)}.pnl .ph b{font-family:var(--disp);font-weight:normal;color:var(--sc);font-size:16px}
.pnl.rdy .ph span{color:var(--ok)}
.pv{width:100%;max-width:150px;aspect-ratio:1;margin:0 auto;display:block}
.opt{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 6px;border-radius:6px;color:var(--dim)}
.opt span:last-child{color:var(--ink);font-family:var(--disp);text-align:right;min-width:0;overflow-wrap:anywhere}
.opt.on{background:var(--sc);color:#120f2a}.opt.on span:last-child{color:#120f2a}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;border:2px solid rgba(0,0,0,.35)}
.pads{display:grid;grid-template-columns:1fr 1.3fr;gap:12px;flex:none}
.steer{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pd{border:0;border-radius:16px;font-size:20px;min-height:110px;color:#120f2a;box-shadow:0 5px 0 rgba(0,0,0,.45);touch-action:none;-webkit-touch-callout:none}
.pd.sm{min-height:64px;background:#2f2a6a;color:var(--ink);font-size:22px}
.pd.brk{background:var(--bad)}.pd.gas{background:var(--ok);min-height:150px}.pd.brk{min-height:150px}
.pd.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45);filter:brightness(1.2)}
.pedOv{position:fixed;left:0;right:0;bottom:0;z-index:3;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.pedOv .pd{opacity:.8;min-height:96px}.pedOv .pd.sm{min-height:56px}

#lights{position:fixed;left:50%;top:16%;transform:translateX(-50%);display:flex;gap:10px;padding:12px 16px;background:#0c0a1c;border:3px solid #2f2a6a;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:4}
#lights i{width:clamp(26px,5vw,44px);aspect-ratio:1;border-radius:50%;background:#2a2440;box-shadow:inset 0 -4px 0 rgba(0,0,0,.4)}
#lights i.r{background:#ff2a3a;box-shadow:0 0 18px #ff2a3a}#lights i.g{background:#35d07f;box-shadow:0 0 22px #35d07f}
.vp.boost::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 55%,transparent 0deg 7deg,rgba(255,255,255,.22) 7deg 8deg);
  -webkit-mask:radial-gradient(circle at 50% 55%,transparent 38%,#000 80%);mask:radial-gradient(circle at 50% 55%,transparent 38%,#000 80%);animation:flick .12s steps(2) infinite}
@keyframes flick{50%{transform:rotate(2deg);opacity:.6}}
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:8px}
.pod{text-align:center;display:grid;gap:2px;min-width:0}.pod .pv{max-width:130px}.pn{font-family:var(--disp);font-size:13px;overflow-wrap:anywhere}
.step{background:linear-gradient(#3b3380,#2a2560);border-radius:8px 8px 0 0;font-family:var(--disp);color:var(--gold);padding-top:8px;font-size:18px}
.p0 .step{height:74px}.p1 .step{height:50px}.p2 .step{height:36px}
@media (prefers-reduced-motion:reduce){.vp.boost::after{animation:none}}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}.seg .btn{font-size:13px;padding:12px 8px}
.vp .cn{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:calc(max(10px,env(safe-area-inset-top,0px)) + clamp(52px,8.4vw,86px));display:flex;align-items:center;gap:6px;font-size:clamp(12px,1.8vw,18px);color:var(--gold)}
.vp .cn i{width:1.1em;height:1.1em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc83d 45%,#c88a00);box-shadow:0 0 0 2px #7a5200}
.newrec{background:var(--gold);color:#1a0f00;font-family:var(--disp);text-align:center;padding:10px;border-radius:10px;animation:pulse 1s ease-in-out infinite alternate}

.ctrl.racing{padding:10px max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));gap:6px;overflow:hidden}
.rc{flex:1;display:grid;grid-template-columns:1fr minmax(150px,32vw) 1fr;gap:10px;min-height:0}
.rc .col,.rc .two{display:grid;gap:10px;min-height:0}.rc .two{grid-template-columns:1fr 1fr}
.rc .pd{min-height:0;height:100%;font-size:clamp(18px,4.5vmin,30px)}

.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;width:100%;margin:0 auto}

@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>

const PREFIX="turbopix-lp-";

const NET={code:"",url:"",msg:"Preparando sala...",conns:[null,null,null,null],peer:null,
  buzz(slot){const cn=this.conns[slot];if(cn&&cn.open){try{cn.send({t:"buzz"})}catch(e){}}else if(slot===G.local&&navigator.vibrate)navigator.vibrate(120)},
  sendAll(){this.conns.forEach((cn,slot)=>{const p=G.players[slot];if(!cn||!cn.open||!p)return;const c=race.cars.find(o=>o.human===slot);
    try{cn.send({t:"ui",scr:G.scr,ready:!!p.ready,row:ROWS[p.row][1],place:c?c.place:0,n:race.cars.length||4,lap:c?Math.min(LAPS,Math.max(1,c.lap)):1,champ:G.mode==="champ",fin:!!(c&&c.finished),paused:!!race.paused,cd:race.on&&race.count>0})}catch(e){}})},
  host(){const fail=t=>{this.msg=t;this.url="";if(G.scr==="lobby")render()};
    if(!window.Peer||!window.RTCPeerConnection)return fail("La conexión entre celulares no funciona aquí. Publica el juego en GitHub Pages para jugar en grupo.");
    const start=()=>{this.code=newCode();this.url=location.href.split("#")[0]+"#mando-"+this.code;let peer;
      try{peer=new Peer(PREFIX+this.code)}catch(e){return fail("La conexión entre celulares no funciona aquí.")}
      this.peer=peer;const to=setTimeout(()=>fail("Sin conexión a internet. Puedes jugar solo en este dispositivo."),9000);
      peer.on("open",()=>{clearTimeout(to);this.msg="O abre el juego en el celular y escribe el código. Entran hasta 4 pilotos.";if(G.scr==="lobby")render()});
      peer.on("disconnected",()=>{setTimeout(()=>{try{if(!peer.destroyed&&peer.disconnected)peer.reconnect()}catch(e){}},1500)});

          setTimeout(()=>{try{if(!peer.destroyed&&peer.disconnected)peer.reconnect()}catch(_){}},2500);return}

  accept(cn){let slot=-1;

   world.movers.forEach(o=>{const lat=o.A*Math.sin(t*o.w+o.ph),p=world.pts[o.idx],n=world.nor[o.idx];o.lat=lat;o.x=p.x+n.x*lat;o.z=p.z+n.z*lat;o.m.position.set(o.x,p.y,o.z);o.m.rotation.y=o.ang;

      if(race.count<=0){[...L.children].forEach(e=>e.className="g");const big=$("big");big.hidden=false;big.textContent="¡YA!";AU.sfx("go");AU.sfx("cheer");TILT.calibrate();setTimeout(()=>NET.sendAll(),0);
        race.cars.forEach(c=>{if(c.human!=null){if(c.in.a>0&&!c.early){c.turbo=1.4;say(c,"¡SALIDA PERFECTA!");AU.sfx("turbo")}else if(c.early)say(c,"¡TE ADELANTASTE!")}else if(Math.random()<.4)c.turbo=1});setTimeout(()=>{if(race.on){big.hidden=true;L.hidden=true}},800)}
      race.cars.forEach(place)}
    else{race.t+=dt;const sub=Math.max(1,Math.ceil(dt*90/1.4));for(let k=0;k<sub;k++)race.cars.forEach(c=>physics(c,dt/sub));
